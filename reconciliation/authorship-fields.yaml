# Cardinal authorship-field registry (CR-BP-118b; this repo's slice).
# Adding a new field here is a CR-level change; do not edit casually.
# CR-ACT-07 registers the actor-record `audit.author` field ahead of the
# first admission (per docs/governance/cardinal-rules.md R1, which notes
# registration as part of the first-admission CR).

fields:
  - path: "**Owner**"                # CR doc metadata; first-30-lines
    file_glob: "change-requests/CR-*.md"
    kind: "metadata"
  - path: "**Author**"               # CR doc metadata; first-30-lines
    file_glob: "change-requests/CR-*.md"
    kind: "metadata"
  - path: "audit.author"              # actor record YAML (CR-ACT-07)
    file_glob: "entities/v1-alpha/**/actors-*.yaml"
    kind: "yaml"

allowlist:
  - "Emmanuel A. Otchere"
  - "TechNeHub Labs"

# Agent / tool names that may never appear in an authorship-bearing field.
# `eaojnr` is allowed as a historical record (user handle alone, no agent prefix).
denylist:
  - "Coder"
  - "Agent"
  - "Hermes"
  - "Claude"
  - "GPT"
  - "Cline"
  - "OpenAI"
  - "MiniMax"
  - "MiniMax-M3"
