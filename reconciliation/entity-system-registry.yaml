# Entity System Registry (CR-ACT-02; per the Conformance Standard CS-011)
# Per-repo lightweight slice of the General Entity System. Data-driven
# configuration for the entity-system gate.
#
# CR-ACT-07: the Actor profile is registered ahead of the first admission
# so ES-002 can resolve `type: Actor` records (the gate fires on any
# non-empty type not in `profiles` while profiles is empty).

# ES-002: Entity Contract (the common envelope + type-specific profiles)
envelope:
  file_globs:
    - "entities/**/*.yaml"
  type_field: type
  profiles:
    Actor:
      required_fields:
        - id
        - type
        - name
        - version
        - lifecycle_status
        - actor_type
        - description

# ES-001: Identity
# Canonical = the org-wide form this repo's own IDM gate enforces
# (check_id_system.py IDM-001); the pre-migration `dea:` family is legacy
# (CR-ACT-05 aligned the two gates; they previously disagreed).
identity:
  id_field: id
  canonical_prefix: "actors:"
  canonical_pattern: "^actors:actor-[a-z0-9-]+-[a-z2-9]{6}$"
  legacy_prefix: "dea:"
  legacy_pattern: "^dea:actor-[a-z0-9-]+$"
  legacy_migration_map: "reconciliation/migration-id-map.yaml"

# ES-003: Relationship (empty; no entity records declare relationships)
relationships:
  field: relationships
  canonical_types: []
  forbidden_types:
    - part-of
  cross_catalog_field: identity_scope

# ES-004: Lifecycle (empty; no entity records have a lifecycle state)
lifecycle:
  field: lifecycle
  status_field: status
  valid_states: []
  terminal_states: []
  transition_table: {}
  provenance_field: provenance.change_history
  provenance_required_keys:
    - cr
    - date
    - change

# ES-005: Per-type gate delegation (empty; no entity types registered)
per_type_gates: []

# CS-008 / CS-009: Exception mechanism (the EGV-011 escape hatch)
exceptions:
  registry_path: reconciliation/normalization.yaml
  verdict_key: verdict
  verdict_value: review-retained
  cr_key: cr
  expiry_key: expiry
  reviewer_key: reviewed_by
  excepted_rules_key: excepted_rules
